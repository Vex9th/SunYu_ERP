name: Windows Release
run-name: Windows ${{ inputs.version || '候选构建' }}

'on':
  workflow_dispatch:
    inputs:
      version:
        description: '正式版本号，须与源码版本一致；留空仅构建候选包'
        required: false
        type: string

concurrency:
  group: windows-release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_needed: ${{ steps.gate.outputs.build_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version and existing release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: python .github/scripts/release_gate.py

  release:
    needs: prepare
    if: needs.prepare.outputs.build_needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python x64
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Resolve package version
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          $version = python -c "from backend.app.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the application version' }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match backend/app/version.py' }
          "SUNYU_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-go@v6
        with:
          go-version-file: updater/go.mod
          cache: false

      - name: Verify independent updater
        working-directory: updater
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Updater tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Updater vet failed' }

      - name: Build independent Windows updater
        working-directory: updater
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w -X main.version=$env:SUNYU_VERSION" -o ../dist/update.exe .

      - name: Lint backend
        run: python -m ruff check . .github/scripts

      - name: Test backend
        run: python -m pytest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        # Windows 上并行挂载多个完整 jsdom 工作区会争抢资源，串行执行文件。
        run: |
          node -e "const os = require('node:os'); console.log({ node: process.version, platform: process.platform, workers: 1, cpus: os.availableParallelism(), memoryGiB: Math.round(os.totalmem() / 1024 ** 3) })"
          npm test -- --maxWorkers=1

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build single-file executable
        run: pyinstaller --clean --noconfirm SunYu_ERP.spec

      - name: Smoke-test packaged executable and persistence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'SunYu ERP 中文 Smoke'
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          Copy-Item 'dist\SunYu_ERP.exe' (Join-Path $smokeRoot 'SunYu_ERP.exe')
          Copy-Item 'dist\update.exe' (Join-Path $smokeRoot 'update.exe')
          $executable = Join-Path $smokeRoot 'SunYu_ERP.exe'
          $healthUrl = 'http://127.0.0.1:8765/api/health'

          function Start-SunYuProcess([string] $suffix) {
            return Start-Process -FilePath $executable `
              -WorkingDirectory $smokeRoot `
              -RedirectStandardOutput (Join-Path $smokeRoot "stdout-$suffix.log") `
              -RedirectStandardError (Join-Path $smokeRoot "stderr-$suffix.log") `
              -PassThru
          }

          function Wait-SunYuHealth([System.Diagnostics.Process] $process) {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($process.HasExited) {
                Get-Content (Join-Path $smokeRoot 'stderr-*.log') -ErrorAction SilentlyContinue
                throw "SunYu_ERP.exe exited before becoming healthy: $($process.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri $healthUrl -TimeoutSec 2
                if ($health.status -eq 'ok') {
                  return
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            throw 'SunYu_ERP.exe did not become healthy within 60 seconds'
          }

          function Stop-SunYuProcess([System.Diagnostics.Process] $process) {
            $process.Refresh()
            if ($process.HasExited) {
              return
            }

            & taskkill.exe /PID $process.Id /T /F | Out-Null
            $taskkillExitCode = $LASTEXITCODE
            $process.Refresh()
            if ($taskkillExitCode -ne 0 -and -not $process.HasExited) {
              throw "Failed to terminate SunYu_ERP.exe process tree: $taskkillExitCode"
            }
            Wait-Process -Id $process.Id -Timeout 15 -ErrorAction SilentlyContinue
            $process.Refresh()
            if (-not $process.HasExited) {
              throw 'SunYu_ERP.exe process tree did not stop within 15 seconds'
            }
          }

          function Wait-SunYuStopped {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $client = [System.Net.Sockets.TcpClient]::new()
              try {
                $client.Connect('127.0.0.1', 8765)
                if (-not $client.Connected) {
                  return
                }
              } catch [System.Net.Sockets.SocketException] {
                return
              } finally {
                $client.Dispose()
              }
              Start-Sleep -Milliseconds 500
            }
            throw 'Port 8765 remained reachable after process-tree termination'
          }

          $first = Start-SunYuProcess 'first'
          try {
            Wait-SunYuHealth $first
            $indexResponse = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing
            if ($indexResponse.StatusCode -ne 200 -or $indexResponse.Content -notmatch '<div id="app">') {
              throw 'Packaged frontend index was not served'
            }
            $assetMatch = [regex]::Match(
              $indexResponse.Content,
              '(?:src|href)="(?<path>/assets/[^"]+)"'
            )
            if (-not $assetMatch.Success) {
              throw 'Packaged frontend index contains no asset URL'
            }
            $asset = Invoke-WebRequest `
              -Uri ("http://127.0.0.1:8765" + $assetMatch.Groups['path'].Value) `
              -UseBasicParsing
            if ($asset.StatusCode -ne 200 -or $asset.Content.Length -le 0) {
              throw 'Packaged frontend asset was not served'
            }
            if (-not (Test-Path (Join-Path $smokeRoot 'config.json'))) {
              throw 'First start did not create config.json beside the executable'
            }
            if (-not (Test-Path (Join-Path $smokeRoot 'Data\iapm.sqlite'))) {
              throw 'First start did not create Data\iapm.sqlite beside the executable'
            }
            python .github/scripts/release_smoke.py seed (Join-Path $smokeRoot 'business-smoke.json')
            if ($LASTEXITCODE -ne 0) { throw 'Packaged business smoke failed' }
          } finally {
            Stop-SunYuProcess $first
          }
          Wait-SunYuStopped

          $configPath = Join-Path $smokeRoot 'config.json'
          $databasePath = Join-Path $smokeRoot 'Data\iapm.sqlite'
          $configBeforeRestart = Get-Content $configPath -Raw
          python -c 'import sqlite3, sys; connection = sqlite3.connect(sys.argv[1]); connection.execute("INSERT OR REPLACE INTO system_settings (key, value_json, updated_at) VALUES (?, ?, ?)", ("release_smoke", "persisted", "now")); connection.commit(); connection.close()' $databasePath

          $second = Start-SunYuProcess 'second'
          try {
            Wait-SunYuHealth $second
            $second.Refresh()
            if ($second.HasExited) {
              throw 'Restarted SunYu_ERP.exe exited immediately after health check'
            }
            python .github/scripts/release_smoke.py verify (Join-Path $smokeRoot 'business-smoke.json')
            if ($LASTEXITCODE -ne 0) { throw 'Packaged business state did not survive restart' }
          } finally {
            Stop-SunYuProcess $second
          }
          Wait-SunYuStopped

          if ((Get-Content $configPath -Raw) -ne $configBeforeRestart) {
            throw 'Restart unexpectedly rewrote config.json'
          }
          $marker = python -c 'import sqlite3, sys; connection = sqlite3.connect(sys.argv[1]); print(connection.execute("SELECT value_json FROM system_settings WHERE key = ?", ("release_smoke",)).fetchone()[0]); connection.close()' $databasePath
          if ($marker.Trim() -ne 'persisted') {
            throw 'Restart did not preserve SQLite data'
          }

      - name: Package singlefile application and updater
        run: python .github/scripts/package_singlefile.py --version "$env:SUNYU_VERSION" --exe dist/SunYu_ERP.exe --updater dist/update.exe --output dist/release

      - name: Download verified singlefile baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path dist/legacy-baseline | Out-Null
          gh release download v1.2.4 --repo "$env:GITHUB_REPOSITORY" --pattern SunYu_ERP-windows-x64.zip --dir dist/legacy-baseline
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download singlefile baseline' }
          $hash = (Get-FileHash dist/legacy-baseline/SunYu_ERP-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'bab84925b30d095e1cf5ea84230a9c5d9fcb581c6578695f154ebadc681eb531') { throw 'Singlefile baseline hash changed' }

      - name: Verify singlefile upgrade and recovery
        run: python .github/scripts/singlefile_upgrade_smoke.py --candidate dist/release --output "$env:RUNNER_TEMP/SunYu ERP 中文 Upgrade" --version "$env:SUNYU_VERSION" --legacy dist/legacy-baseline/SunYu_ERP-windows-x64.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: SunYu_ERP-windows-x64
          path: |
            dist/release/SunYu_ERP-windows-x64.zip
            dist/release/update.exe
            dist/release/update-manifest-singlefile.json
            dist/release/SHA256SUMS.txt
            ${{ runner.temp }}/SunYu ERP 中文 Upgrade/verification-result.json
          if-no-files-found: error

      - name: Recheck release before publishing
        if: inputs.version != ''
        id: publish_gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          git fetch --tags origin
          if ($LASTEXITCODE -ne 0) { throw 'Cannot refresh release tags' }
          python .github/scripts/release_gate.py

      - name: Create release draft
        if: steps.publish_gate.outputs.state == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: gh release create "$env:RELEASE_TAG" --draft --target "$env:GITHUB_SHA" --notes-file RELEASE_NOTES.md --title "$env:RELEASE_TAG"

      - name: Upload verified assets to draft
        if: steps.publish_gate.outputs.state == 'new' || steps.publish_gate.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: gh release upload "$env:RELEASE_TAG" dist/release/SunYu_ERP-windows-x64.zip dist/release/update.exe dist/release/update-manifest-singlefile.json dist/release/SHA256SUMS.txt --clobber

      - name: Publish complete release
        if: steps.publish_gate.outputs.state == 'new' || steps.publish_gate.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: gh release edit "$env:RELEASE_TAG" --draft=false --latest
