name: Windows Release
run-name: Windows ${{ inputs.version || '候选构建' }}

'on':
  workflow_dispatch:
    inputs:
      version:
        description: '正式版本号，例如 v2.0.0；留空仅构建候选包'
        required: false
        type: string

concurrency:
  group: windows-release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_needed: ${{ steps.gate.outputs.build_needed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check version and existing release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: node .github/scripts/release-gate.mjs

  release:
    needs: prepare
    if: needs.prepare.outputs.build_needed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG.Substring(1) } else { '2.0.0' }
          "SUNYU_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify native backend and updater
        working-directory: server
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Native Go tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go vet failed' }
      - name: Verify release protection
        run: node --test .github/scripts/release-gate.test.mjs
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test -- --maxWorkers=1
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build native Windows executables
        working-directory: server
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Path ../dist/native-bin -Force | Out-Null
          $flags = "-s -w -H=windowsgui -X main.version=$env:SUNYU_VERSION"
          go build -trimpath -ldflags="$flags" -o ../dist/native-bin/SunYu_ERP.exe ./cmd/launcher
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
          go build -trimpath -ldflags="$flags" -o ../dist/native-bin/SunYuService.exe ./cmd/service
          if ($LASTEXITCODE -ne 0) { throw 'Service build failed' }
          go build -trimpath -ldflags="-s -w -X main.version=$env:SUNYU_VERSION" -o ../dist/native-bin/update.exe ./cmd/updater
          if ($LASTEXITCODE -ne 0) { throw 'Independent updater build failed' }
      - name: Assemble verified native packages
        working-directory: server
        run: go run ./cmd/package --version "$env:SUNYU_VERSION" --bin-dir ../dist/native-bin --web-dir ../frontend/dist --output ../dist/native --notes (Get-Content ../RELEASE_NOTES.md -Raw -Encoding utf8)
      - name: Verify packaged startup, single instance and data persistence
        run: node .github/scripts/native-smoke.mjs dist/native/SunYu_ERP "$env:RUNNER_TEMP/SunYu ERP 中文 Native Smoke" "$env:SUNYU_VERSION"
      - name: Build isolated frontend and application upgrade fixtures
        run: node .github/scripts/build-upgrade-fixtures.mjs dist/native dist/upgrade-fixtures "$env:SUNYU_VERSION"
      - name: Download and verify legacy migration baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path dist/legacy-baseline | Out-Null
          gh release download v1.3.1 --repo "$env:GITHUB_REPOSITORY" --pattern SunYu_ERP-windows-x64.zip --dir dist/legacy-baseline
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download legacy migration baseline' }
          $hash = (Get-FileHash dist/legacy-baseline/SunYu_ERP-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'b2568323d110a6102777fbb589b8af69f6c7192471c7504f1defc8357ab62591') { throw 'Legacy migration baseline hash changed' }
      - name: Verify legacy migration, hot updates, application replacement and failed migration recovery
        run: node .github/scripts/native-upgrade-smoke.mjs dist/legacy-baseline/SunYu_ERP-windows-x64.zip dist/upgrade-fixtures "$env:RUNNER_TEMP/SunYu ERP 中文 Upgrade Smoke" "$env:SUNYU_VERSION"
      - name: Verify external data junction upgrade and recovery compatibility
        run: node .github/scripts/native-upgrade-smoke.mjs dist/legacy-baseline/SunYu_ERP-windows-x64.zip dist/upgrade-fixtures "$env:RUNNER_TEMP/SunYu ERP 中文 Junction Smoke" "$env:SUNYU_VERSION" junction
      - name: Verify short data directory name upgrade and recovery compatibility
        run: node .github/scripts/native-upgrade-smoke.mjs dist/legacy-baseline/SunYu_ERP-windows-x64.zip dist/upgrade-fixtures "$env:RUNNER_TEMP/SunYu ERP 中文 Short Name Smoke" "$env:SUNYU_VERSION" short-leaf
      - name: Upload candidate and validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: SunYu_ERP-windows-x64
          path: |
            dist/native/*.zip
            dist/native/update.exe
            dist/native/update-manifest*.json
            dist/native/SHA256SUMS.txt
            ${{ runner.temp }}/SunYu ERP 中文 Native Smoke/native-smoke-result.json
            ${{ runner.temp }}/SunYu ERP 中文 Upgrade Smoke/native-upgrade-result.json
            ${{ runner.temp }}/SunYu ERP 中文 Junction Smoke/native-upgrade-result.json
            ${{ runner.temp }}/SunYu ERP 中文 Short Name Smoke/native-upgrade-result.json
          if-no-files-found: error
      - name: Upload failed verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: SunYu_ERP-native-validation-logs
          path: |
            ${{ runner.temp }}/SunYu ERP 中文 Native Smoke/*.log
            ${{ runner.temp }}/SunYu ERP 中文 Native Smoke/.updates/logs/*.log
            ${{ runner.temp }}/SunYu ERP 中文 Upgrade Smoke/*.log
            ${{ runner.temp }}/SunYu ERP 中文 Upgrade Smoke/installation/.updates/logs/*.log
            ${{ runner.temp }}/SunYu ERP 中文 Junction Smoke/*.log
            ${{ runner.temp }}/SunYu ERP 中文 Junction Smoke/installation/.updates/logs/*.log
            ${{ runner.temp }}/SunYu ERP 中文 Short Name Smoke/*.log
            ${{ runner.temp }}/SunYu ERP 中文 Short Name Smoke/installation/.updates/logs/*.log
          if-no-files-found: ignore
      - name: Recheck release before publishing
        if: inputs.version != ''
        id: publish_gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          git fetch --tags origin
          if ($LASTEXITCODE -ne 0) { throw 'Cannot refresh release tags' }
          node .github/scripts/release-gate.mjs
      - name: Create release draft
        if: steps.publish_gate.outputs.state == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: gh release create "$env:RELEASE_TAG" --draft --target "$env:GITHUB_SHA" --notes-file RELEASE_NOTES.md --title "$env:RELEASE_TAG"
      - name: Upload verified assets to draft
        if: steps.publish_gate.outputs.state == 'new' || steps.publish_gate.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          $assets = Get-ChildItem 'dist/native' -File | Where-Object { $_.Extension -in @('.zip', '.exe') -or $_.Name -in @('update-manifest.json', 'update-manifest-v2.json', 'SHA256SUMS.txt') }
          gh release upload "$env:RELEASE_TAG" @($assets.FullName) --clobber
      - name: Publish complete release
        if: steps.publish_gate.outputs.state == 'new' || steps.publish_gate.outputs.state == 'draft'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: gh release edit "$env:RELEASE_TAG" --draft=false --latest
